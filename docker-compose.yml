version: '3.8'

services:
  rag-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_telegram_bot
    env_file:
      - .env 
    volumes:
      - ./knowledge_base:/app/knowledge_base 
      - ./index:/app/index                 
      - ./hf_cache:/root/.cache/huggingface 
    ports:
      - "8000:8000" 
    restart: unless-stopped
